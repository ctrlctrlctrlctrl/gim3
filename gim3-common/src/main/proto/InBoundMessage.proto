syntax = "proto3";

import "google/protobuf/any.proto";

package com.guo.im.server.common.message;
option java_multiple_files = true;

message InBoundMessage {
  string messageId = 1;
  int32 cmd = 2;
  int64 timestamp = 3;
  int32 payloadType = 4;
  int32 payloadVersion = 5;
  bytes  payload = 6;
}