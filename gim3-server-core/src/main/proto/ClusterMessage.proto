syntax = "proto3";

import "google/protobuf/any.proto";

package com.guo.im.server.core.internal.model;

message ClusterMessage {
  string messageId = 1;
  string sourceInstanceId = 2;
  string targetInstanceId = 3;
  int32 clusterCMD = 4;
  int32 payloadType = 5;
  int32 payloadVersion = 6;
  bytes payload = 7;
}